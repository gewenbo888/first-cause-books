<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae4a3"/>
      <stop offset="1" stop-color="#a88638"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fae4a3" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d4af55" stop-opacity="0.4"/>
      <stop offset="1"   stop-color="#d4af55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0a0e1f"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.6" fill="none" stroke="#d4af55" stroke-opacity="0.36"/>
  <!-- starfield: a handful of small stars -->
  <circle cx="6"  cy="6"  r="0.5" fill="#fae4a3"/>
  <circle cx="26" cy="7"  r="0.6" fill="#fae4a3"/>
  <circle cx="8"  cy="24" r="0.5" fill="#fae4a3"/>
  <circle cx="25" cy="25" r="0.7" fill="#fae4a3"/>
  <circle cx="22" cy="14" r="0.4" fill="#fae4a3"/>
  <circle cx="9"  cy="15" r="0.4" fill="#fae4a3"/>
  <!-- the central "first cause" star with halo -->
  <circle cx="16" cy="16" r="9" fill="url(#starGlow)"/>
  <!-- 4-pointed star -->
  <path d="M16 5 L17.2 14.8 L27 16 L17.2 17.2 L16 27 L14.8 17.2 L5 16 L14.8 14.8 Z" fill="url(#g)" stroke="#a88638" stroke-width="0.3"/>
